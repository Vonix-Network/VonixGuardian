/*
 * VonixGuardian — mc-26.2 :common
 *
 * Mojmap-only compilation units consumed by 26.2 Fabric (and, after merge,
 * 26.2 NeoForge). Loaders compile these sources against their own Minecraft
 * classpath via sourceSets; this module does not apply Fabric/NeoForge APIs.
 *
 * NOTE: this tree is a cell-local copy of the 26.x common sources. The parent
 * merge should reconcile it with the NeoForge 26.2 cell's common tree.
 */

plugins {
    id 'java-library'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

dependencies {
    compileOnly project(':core')
    compileOnly libs.slf4j.api
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    // net.minecraft is supplied by consuming loaders, not this module.
    enabled = false
}

tasks.register('verifyCommonSources') {
    def src = file('src/main/java/network/vonix/guardian/mc/v26_2/common')
    inputs.dir(src)
    doLast {
        if (!src.directory) {
            throw new GradleException("missing 26.2 common sources at ${src}")
        }
        def files = src.listFiles({ f -> f.name.endsWith('.java') } as FileFilter)
        if (files == null || files.length == 0) {
            throw new GradleException("26.2 common source set is empty")
        }
    }
}

tasks.named('jar') {
    dependsOn 'verifyCommonSources'
    from sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
