/*
 * VonixGuardian — mc-1.21.1 :common
 *
 * Mojmap-only compilation units shared by 1.21.1 Fabric and NeoForge.
 * Loaders compile these sources against their own Minecraft classpath via
 * sourceSets (see fabric/neoforge build.gradle). This module is a real Gradle
 * project so settings.gradle includes it and loaders depend on it; it does
 * not apply Fabric/Forge/NeoForge plugins.
 */

plugins {
    id 'java-library'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
    compileOnly project(':core')
    compileOnly libs.slf4j.api
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    // net.minecraft is supplied by consuming loaders, not this module.
    enabled = false
}

tasks.register('verifyCommonSources') {
    def src = file('src/main/java/network/vonix/guardian/mc/v1_21_1/common')
    inputs.dir(src)
    doLast {
        if (!src.directory) {
            throw new GradleException("missing 1.21.1 common sources at ${src}")
        }
        def files = src.listFiles({ f -> f.name.endsWith('.java') } as FileFilter)
        if (files == null || files.length == 0) {
            throw new GradleException("1.21.1 common source set is empty")
        }
    }
}

tasks.named('jar') {
    dependsOn 'verifyCommonSources'
    from sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
