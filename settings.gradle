pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'VonixGuardian'

// Build profile: 'coreonly' builds only :core (fast iteration on the engine);
// 'mc1211' adds 1.21.1 NeoForge + Fabric; 'mc2612' adds 26.1.2 NeoForge;
// 'mc262' adds 26.2 NeoForge only; 'mc263' adds 26.3 NeoForge only (loader pin
// 26.3.0.6-beta). Fabric 26.2 is only 'mc262fabric' and Fabric 26.3 is only
// 'mc263fabric' (Loom 1.17.21 needs Gradle 9.5+, so those cells must not be
// configured by the Gradle 9.2.0 NeoForge jobs). 'all' adds every MC version
// and loader except the Fabric 26.x cells.
// (default when unset, except metadata-only root tasks like printVersion).
// 'forgeonly' = every Forge + NeoForge module, skipping Fabric (avoids the
// fabric-loom classloader conflict during cross-version builds).
// Legacy alias 'core' == 'coreonly'.
//
// A bare `./gradlew printVersion` is intentionally metadata-only: keep it in
// the core-only profile so Gradle does not configure every loader cell just to
// print the root project version. This avoids Fabric Loom's known cross-version
// classloader conflict without changing the default for build/test tasks.
def explicitBuildProfile = providers.gradleProperty('buildProfile')
def requestedTasks = gradle.startParameter.taskNames
def printVersionOnly = requestedTasks && requestedTasks.every { it == 'printVersion' || it == ':printVersion' }
def profile = explicitBuildProfile.getOrElse(printVersionOnly ? 'coreonly' : 'all')
if (profile == 'core') profile = 'coreonly'

// Pure-Java engine (no MC).
include 'core'

// Include mc-<version>/common when that module exists on disk.
// Requested cells: mc-1.21.1/common (Fabric + NeoForge), mc-26.1.2/common
// (NeoForge only), mc-26.2/common (NeoForge + Fabric), and mc-26.3/common
// (NeoForge + Fabric).
def includedVersionCommons = [] as Set
def includeVersionCommonIfPresent = { String version ->
    if (!includedVersionCommons.add(version)) {
        return
    }
    def commonDir = file("mc-${version}/common")
    def buildFile = new File(commonDir, 'build.gradle')
    if (commonDir.directory && buildFile.file) {
        include ":mc-${version}:common"
    }
}

if (profile == 'mc1211' || profile == 'all' || profile == 'forgeonly') {
    include ':mc-1.21.1:neoforge'
    includeVersionCommonIfPresent('1.21.1')
}
if (profile == 'mc2612' || profile == 'all' || profile == 'forgeonly') {
    include ':mc-26.1.2:neoforge'
    includeVersionCommonIfPresent('26.1.2')
}
if (profile == 'mc262' || profile == 'mc263' || profile == 'all' || profile == 'forgeonly') {
    if (profile != 'mc263') {
        include ':mc-26.2:neoforge'
        includeVersionCommonIfPresent('26.2')
    }
    if (profile != 'mc262') {
        include ':mc-26.3:neoforge'
        includeVersionCommonIfPresent('26.3')
    }
}

if (profile == 'mc1211' || profile == 'all') {
    include ':mc-1.21.1:fabric'
    includeVersionCommonIfPresent('1.21.1')
}
// Fabric 26.2 is a dedicated profile. Loom 1.17.21 requires Gradle 9.5+, so it
// must not be configured by mc262 / all (those run on Gradle 9.2.0 / 8.10.2).
// Fabric 26.1.2 needs Loom 1.17.21 (Gradle 9.5+), so it gets its own profile
// and must not be configured by the Gradle 9.2.0 NeoForge jobs.
if (profile == 'mc2612fabric') {
    include ':mc-26.1.2:common'
    include ':mc-26.1.2:fabric'
}

if (profile == 'mc262fabric') {
    include ':mc-26.2:fabric'
    includeVersionCommonIfPresent('26.2')
}

// Fabric 26.3 is a dedicated profile: Loom 1.17 + Gradle 9.6.0+ + Java 25.
if (profile == 'mc263fabric') {
    include ':mc-26.3:fabric'
    includeVersionCommonIfPresent('26.3')
}

if (profile == 'mc1201' || profile == 'all' || profile == 'forgeonly') {
    include ':mc-1.20.1:forge'
}
if (profile == 'mc1201' || profile == 'all') {
    include ':mc-1.20.1:fabric'
}

if (profile == 'mc1192' || profile == 'all' || profile == 'forgeonly') {
    include ':mc-1.19.2:forge'
}
if (profile == 'mc1192' || profile == 'all') {
    include ':mc-1.19.2:fabric'
}

if (profile == 'mc1182' || profile == 'all' || profile == 'forgeonly') {
    include ':mc-1.18.2:forge'
}
if (profile == 'mc1182' || profile == 'all') {
    include ':mc-1.18.2:fabric'
}
