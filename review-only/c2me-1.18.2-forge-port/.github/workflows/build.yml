name: Threaded Horizons Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Clean build and test
        run: |
          export JAVA_HOME=${JAVA_HOME}
          java -version
          ./gradlew --no-daemon clean test build
      - name: Artifact path check
        run: |
          test -f build/libs/threaded-horizons-mc1.18.2-0.1.0-alpha.1.jar
          sha256sum build/libs/threaded-horizons-mc1.18.2-0.1.0-alpha.1.jar
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: threaded-horizons-artifact
          path: build/libs/threaded-horizons-mc1.18.2-0.1.0-alpha.1.jar
