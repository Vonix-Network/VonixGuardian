# VonixGuardian - Polish (pl) message bundle
#
# Format: MessageFormat (java.text.MessageFormat).
#   Placeholders: {0}, {1} - a literal '{' must be escaped as ''{''
#   Single quotes must be doubled: '' - see MessageFormat javadoc.
#
# Key set is identical to en_us.properties (enforced by LangBundleParityTest).
# Values were re-translated from the en_us SEMANTICS, not from the CoreProtect
# seed file this bundle was originally generated from. Several seed lines carried
# a weaker or wrong meaning (e.g. "not approved" for "not supported"), so they
# were replaced rather than kept.
#
# Do not translate the literal syntax tokens in these strings: u: t: r: a: i: e:,
# #sentinel, #keyword, #global, #world_nether, #world_<key>, #we, #worldedit,
# //wand, the unit letters s m h d w, and the examples 1h / 2w5d / 1h-2h.
# They are parsed by QueryParser and must stay byte-identical to the input
# grammar.

# ---- QueryParser (/vg lookup <filter>) player errors ----------------------
query.error.expected_prefix         = oczekiwano ''<prefix>:<value>'' (u:, t:, r:, a:, i:, e:) lub #flag
query.error.unknown_prefix          = nieznany prefiks ''{0}:'' \u2014 oczekiwano jednego z u: t: r: a: i: e:
query.error.user_empty              = u: wymaga co najmniej jednej nazwy gracza lub #sentinel
query.error.user_empty_entry        = u: zawiera pusty wpis \u2014 usu\u0144 zb\u0119dny przecinek
query.error.user_invalid_name       = ''{0}'' nie jest prawid\u0142ow\u0105 nazw\u0105 gracza (litery, cyfry, podkre\u015blenie; maks. 16) \u2014 czy chodzi\u0142o o #sentinel?
query.error.time_required           = t: wymaga czasu trwania, np. 1h, 2w5d lub 1h-2h
query.error.time_range_both_sides   = t: zakres wymaga czasu trwania po obu stronach ''-'' (np. 1h-2h)
query.error.duration_no_number      = sk\u0142adnik czasu trwania musi zaczyna\u0107 si\u0119 od liczby: ''{0}''
query.error.duration_missing_unit   = w czasie trwania ''{0}'' brakuje jednostki (u\u017cyj s, m, h, d lub w)
query.error.duration_bad_number     = czas trwania ''{0}'' zawiera nieprawid\u0142ow\u0105 liczb\u0119 ''{1}''
query.error.duration_unknown_unit   = nieznana jednostka czasu ''{0}'' w ''{1}'' \u2014 u\u017cyj s, m, h, d lub w
query.error.duration_empty          = pusty czas trwania
query.error.radius_required         = r: wymaga promienia (np. r:10, r:#global, r:#world_nether)
query.error.radius_not_integer      = promie\u0144 musi by\u0107 liczb\u0105 ca\u0142kowit\u0105 nieujemn\u0105 lub #keyword; otrzymano ''{0}''
query.error.radius_negative         = promie\u0144 musi by\u0107 >= 0 (otrzymano {0}) \u2014 u\u017cyj r:#global dla nieograniczonego
query.error.radius_no_position      = r:<n> wymaga pozycji gracza; konsola musi u\u017cy\u0107 r:#global lub r:#world_<key>
query.error.action_required         = a: wymaga nazwy akcji \u2014 {0}
query.error.action_unknown          = nieznana akcja ''{0}'' \u2014 {1}
query.error.ident_empty             = {0} wymaga co najmniej jednego identyfikatora
query.error.ident_empty_entry       = {0} zawiera pusty wpis \u2014 usu\u0144 zb\u0119dny przecinek
query.error.ident_bad_namespace     = nieprawid\u0142owa przestrze\u0144 nazw ''{0}'' w identyfikatorze ''{1}''
query.error.ident_bad_path          = nieprawid\u0142owa \u015bcie\u017cka identyfikatora ''{0}'' w ''{1}''
query.error.flag_unknown            = nieznana flaga ''{0}'' \u2014 prawid\u0142owe flagi: #preview, #count, #verbose, #silent, #optimize
query.error.bad_token_wrap          = nieprawid\u0142owy token ''{0}'': {1}
# ---- /vg status section headers ---------------------------------------
status.section.guardian             = VonixGuardian
status.section.storage              = Magazyn
status.section.queue                = Kolejka zapisu
status.section.hooks                = Hooki zdarze\u0144
status.section.permissions          = Uprawnienia
status.section.public_api           = Publiczne API
# ---- WorldEdit-backed radius keywords -------------------------------------
query.error.worldedit_not_installed = WorldEdit nie jest zainstalowany \u2014 r:#we / r:#worldedit wymaga WorldEdit na serwerze
query.error.worldedit_no_selection  = nie masz aktywnego zaznaczenia WorldEdit \u2014 najpierw utw\u00f3rz zaznaczenie za pomoc\u0105 //wand
