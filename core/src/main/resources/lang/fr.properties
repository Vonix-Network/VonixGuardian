# VonixGuardian - French (fr) message bundle
#
# Format: MessageFormat (java.text.MessageFormat).
#   Placeholders: {0}, {1} - a literal '{' must be escaped as ''{''
#   Single quotes must be doubled: '' - see MessageFormat javadoc.
#
# Key set is identical to en_us.properties (enforced by LangBundleParityTest).
# Values were re-translated from the en_us SEMANTICS, not from the CoreProtect
# seed file this bundle was originally generated from. Several seed lines carried
# a weaker or wrong meaning (e.g. "not approved" for "not supported"), so they
# were replaced rather than kept.
#
# Do not translate the literal syntax tokens in these strings: u: t: r: a: i: e:,
# #sentinel, #keyword, #global, #world_nether, #world_<key>, #we, #worldedit,
# //wand, the unit letters s m h d w, and the examples 1h / 2w5d / 1h-2h.
# They are parsed by QueryParser and must stay byte-identical to the input
# grammar.

# ---- QueryParser (/vg lookup <filter>) player errors ----------------------
query.error.expected_prefix         = ''<pr\u00e9fixe>:<valeur>'' attendu (u:, t:, r:, a:, i:, e:) ou #flag
query.error.unknown_prefix          = pr\u00e9fixe inconnu ''{0}:'' \u2014 attendu l''un de u: t: r: a: i: e:
query.error.user_empty              = u: n\u00e9cessite au moins un nom de joueur ou #sentinel
query.error.user_empty_entry        = u: contient une entr\u00e9e vide \u2014 supprimez la virgule en trop
query.error.user_invalid_name       = ''{0}'' n''est pas un nom de joueur valide (lettres, chiffres, tiret bas ; max 16) \u2014 vouliez-vous dire un #sentinel ?
query.error.time_required           = t: n\u00e9cessite une dur\u00e9e comme 1h, 2w5d ou 1h-2h
query.error.time_range_both_sides   = t: une plage n\u00e9cessite une dur\u00e9e des deux c\u00f4t\u00e9s de ''-'' (par ex. 1h-2h)
query.error.duration_no_number      = un composant de dur\u00e9e doit commencer par un nombre : ''{0}''
query.error.duration_missing_unit   = la dur\u00e9e ''{0}'' n''a pas d''unit\u00e9 (utilisez s, m, h, d ou w)
query.error.duration_bad_number     = la dur\u00e9e ''{0}'' contient un nombre invalide ''{1}''
query.error.duration_unknown_unit   = unit\u00e9 de dur\u00e9e inconnue ''{0}'' dans ''{1}'' \u2014 utilisez s, m, h, d ou w
query.error.duration_empty          = dur\u00e9e vide
query.error.radius_required         = r: n\u00e9cessite un rayon (par ex. r:10, r:#global, r:#world_nether)
query.error.radius_not_integer      = le rayon doit \u00eatre un entier positif ou nul, ou un #keyword ; re\u00e7u ''{0}''
query.error.radius_negative         = le rayon doit \u00eatre >= 0 (re\u00e7u {0}) \u2014 utilisez r:#global pour illimit\u00e9
query.error.radius_no_position      = r:<n> n\u00e9cessite la position d''un joueur ; la console doit utiliser r:#global ou r:#world_<key>
query.error.action_required         = a: n\u00e9cessite un nom d''action \u2014 {0}
query.error.action_unknown          = action inconnue ''{0}'' \u2014 {1}
query.error.ident_empty             = {0} n\u00e9cessite au moins un identifiant
query.error.ident_empty_entry       = {0} contient une entr\u00e9e vide \u2014 supprimez la virgule en trop
query.error.ident_bad_namespace     = espace de noms invalide ''{0}'' dans l''identifiant ''{1}''
query.error.ident_bad_path          = chemin d''identifiant invalide ''{0}'' dans ''{1}''
query.error.flag_unknown            = indicateur inconnu ''{0}'' \u2014 indicateurs valides : #preview, #count, #verbose, #silent, #optimize
query.error.bad_token_wrap          = jeton invalide ''{0}'' : {1}
# ---- /vg status section headers ---------------------------------------
status.section.guardian             = VonixGuardian
status.section.storage              = Stockage
status.section.queue                = File d''\u00e9criture
status.section.hooks                = Hooks d''\u00e9v\u00e9nements
status.section.permissions          = Permissions
status.section.public_api           = API publique
# ---- WorldEdit-backed radius keywords -------------------------------------
query.error.worldedit_not_installed = WorldEdit n''est pas install\u00e9 \u2014 r:#we / r:#worldedit n\u00e9cessite WorldEdit sur le serveur
query.error.worldedit_no_selection  = vous n''avez aucune s\u00e9lection WorldEdit active \u2014 faites d''abord une s\u00e9lection avec //wand
