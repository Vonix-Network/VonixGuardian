# VonixGuardian - Spanish (es) message bundle
#
# Format: MessageFormat (java.text.MessageFormat).
#   Placeholders: {0}, {1} - a literal '{' must be escaped as ''{''
#   Single quotes must be doubled: '' - see MessageFormat javadoc.
#
# Key set is identical to en_us.properties (enforced by LangBundleParityTest).
# Values were re-translated from the en_us SEMANTICS, not from the CoreProtect
# seed file this bundle was originally generated from. Several seed lines carried
# a weaker or wrong meaning (e.g. "not approved" for "not supported"), so they
# were replaced rather than kept.
#
# Do not translate the literal syntax tokens in these strings: u: t: r: a: i: e:,
# #sentinel, #keyword, #global, #world_nether, #world_<key>, #we, #worldedit,
# //wand, the unit letters s m h d w, and the examples 1h / 2w5d / 1h-2h.
# They are parsed by QueryParser and must stay byte-identical to the input
# grammar.

# ---- QueryParser (/vg lookup <filter>) player errors ----------------------
query.error.expected_prefix         = se esperaba ''<prefijo>:<valor>'' (u:, t:, r:, a:, i:, e:) o #flag
query.error.unknown_prefix          = prefijo desconocido ''{0}:'' \u2014 se esperaba uno de u: t: r: a: i: e:
query.error.user_empty              = u: requiere al menos un nombre de jugador o #sentinel
query.error.user_empty_entry        = u: contiene una entrada vac\u00eda \u2014 elimina la coma sobrante
query.error.user_invalid_name       = ''{0}'' no es un nombre de jugador v\u00e1lido (letras, d\u00edgitos, guion bajo; m\u00e1x. 16) \u2014 \u00bfquer\u00edas decir un #sentinel?
query.error.time_required           = t: requiere una duraci\u00f3n como 1h, 2w5d o 1h-2h
query.error.time_range_both_sides   = t: un rango requiere duraciones a ambos lados de ''-'' (p. ej. 1h-2h)
query.error.duration_no_number      = el componente de duraci\u00f3n debe empezar por un n\u00famero: ''{0}''
query.error.duration_missing_unit   = a la duraci\u00f3n ''{0}'' le falta la unidad (usa s, m, h, d o w)
query.error.duration_bad_number     = la duraci\u00f3n ''{0}'' tiene un n\u00famero no v\u00e1lido ''{1}''
query.error.duration_unknown_unit   = unidad de duraci\u00f3n desconocida ''{0}'' en ''{1}'' \u2014 usa s, m, h, d o w
query.error.duration_empty          = duraci\u00f3n vac\u00eda
query.error.radius_required         = r: requiere un radio (p. ej. r:10, r:#global, r:#world_nether)
query.error.radius_not_integer      = el radio debe ser un entero no negativo o un #keyword; se recibi\u00f3 ''{0}''
query.error.radius_negative         = el radio debe ser >= 0 (se recibi\u00f3 {0}) \u2014 usa r:#global para sin l\u00edmite
query.error.radius_no_position      = r:<n> requiere la posici\u00f3n de un jugador; la consola debe usar r:#global o r:#world_<key>
query.error.action_required         = a: requiere un nombre de acci\u00f3n \u2014 {0}
query.error.action_unknown          = acci\u00f3n desconocida ''{0}'' \u2014 {1}
query.error.ident_empty             = {0} requiere al menos un identificador
query.error.ident_empty_entry       = {0} contiene una entrada vac\u00eda \u2014 elimina la coma sobrante
query.error.ident_bad_namespace     = espacio de nombres no v\u00e1lido ''{0}'' en el identificador ''{1}''
query.error.ident_bad_path          = ruta de identificador no v\u00e1lida ''{0}'' en ''{1}''
query.error.flag_unknown            = indicador desconocido ''{0}'' \u2014 indicadores v\u00e1lidos: #preview, #count, #verbose, #silent, #optimize
query.error.bad_token_wrap          = token no v\u00e1lido ''{0}'': {1}
# ---- /vg status section headers ---------------------------------------
status.section.guardian             = VonixGuardian
status.section.storage              = Almacenamiento
status.section.queue                = Cola de escritura
status.section.hooks                = Hooks de eventos
status.section.permissions          = Permisos
status.section.public_api           = API p\u00fablica
# ---- WorldEdit-backed radius keywords -------------------------------------
query.error.worldedit_not_installed = WorldEdit no est\u00e1 instalado \u2014 r:#we / r:#worldedit requiere WorldEdit en el servidor
query.error.worldedit_no_selection  = no tienes ninguna selecci\u00f3n de WorldEdit activa \u2014 crea una selecci\u00f3n primero con //wand
