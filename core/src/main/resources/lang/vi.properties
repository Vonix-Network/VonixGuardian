# VonixGuardian - Vietnamese (vi) message bundle
#
# Format: MessageFormat (java.text.MessageFormat).
#   Placeholders: {0}, {1} - a literal '{' must be escaped as ''{''
#   Single quotes must be doubled: '' - see MessageFormat javadoc.
#
# Key set is identical to en_us.properties (enforced by LangBundleParityTest).
# Values were re-translated from the en_us SEMANTICS, not from the CoreProtect
# seed file this bundle was originally generated from. Several seed lines carried
# a weaker or wrong meaning (e.g. "not approved" for "not supported"), so they
# were replaced rather than kept.
#
# Do not translate the literal syntax tokens in these strings: u: t: r: a: i: e:,
# #sentinel, #keyword, #global, #world_nether, #world_<key>, #we, #worldedit,
# //wand, the unit letters s m h d w, and the examples 1h / 2w5d / 1h-2h.
# They are parsed by QueryParser and must stay byte-identical to the input
# grammar.

# ---- QueryParser (/vg lookup <filter>) player errors ----------------------
query.error.expected_prefix         = c\u1ea7n ''<prefix>:<value>'' (u:, t:, r:, a:, i:, e:) ho\u1eb7c #flag
query.error.unknown_prefix          = ti\u1ec1n t\u1ed1 kh\u00f4ng x\u00e1c \u0111\u1ecbnh ''{0}:'' \u2014 c\u1ea7n m\u1ed9t trong u: t: r: a: i: e:
query.error.user_empty              = u: c\u1ea7n \u00edt nh\u1ea5t m\u1ed9t t\u00ean ng\u01b0\u1eddi ch\u01a1i ho\u1eb7c #sentinel
query.error.user_empty_entry        = u: c\u00f3 m\u1ed9t m\u1ee5c r\u1ed7ng \u2014 h\u00e3y x\u00f3a d\u1ea5u ph\u1ea9y th\u1eeba
query.error.user_invalid_name       = ''{0}'' kh\u00f4ng ph\u1ea3i l\u00e0 t\u00ean ng\u01b0\u1eddi ch\u01a1i h\u1ee3p l\u1ec7 (ch\u1eef c\u00e1i, ch\u1eef s\u1ed1, g\u1ea1ch d\u01b0\u1edbi; t\u1ed1i \u0111a 16) \u2014 b\u1ea1n c\u00f3 \u00fd d\u00f9ng #sentinel kh\u00f4ng?
query.error.time_required           = t: c\u1ea7n m\u1ed9t kho\u1ea3ng th\u1eddi gian nh\u01b0 1h, 2w5d ho\u1eb7c 1h-2h
query.error.time_range_both_sides   = t: kho\u1ea3ng c\u1ea7n th\u1eddi l\u01b0\u1ee3ng \u1edf c\u1ea3 hai b\u00ean d\u1ea5u ''-'' (v\u00ed d\u1ee5 1h-2h)
query.error.duration_no_number      = th\u00e0nh ph\u1ea7n th\u1eddi l\u01b0\u1ee3ng ph\u1ea3i b\u1eaft \u0111\u1ea7u b\u1eb1ng m\u1ed9t s\u1ed1: ''{0}''
query.error.duration_missing_unit   = th\u1eddi l\u01b0\u1ee3ng ''{0}'' thi\u1ebfu \u0111\u01a1n v\u1ecb (d\u00f9ng s, m, h, d ho\u1eb7c w)
query.error.duration_bad_number     = th\u1eddi l\u01b0\u1ee3ng ''{0}'' c\u00f3 s\u1ed1 kh\u00f4ng h\u1ee3p l\u1ec7 ''{1}''
query.error.duration_unknown_unit   = \u0111\u01a1n v\u1ecb th\u1eddi l\u01b0\u1ee3ng kh\u00f4ng x\u00e1c \u0111\u1ecbnh ''{0}'' trong ''{1}'' \u2014 d\u00f9ng s, m, h, d ho\u1eb7c w
query.error.duration_empty          = th\u1eddi l\u01b0\u1ee3ng r\u1ed7ng
query.error.radius_required         = r: c\u1ea7n m\u1ed9t b\u00e1n k\u00ednh (v\u00ed d\u1ee5 r:10, r:#global, r:#world_nether)
query.error.radius_not_integer      = b\u00e1n k\u00ednh ph\u1ea3i l\u00e0 s\u1ed1 nguy\u00ean kh\u00f4ng \u00e2m ho\u1eb7c m\u1ed9t #keyword; nh\u1eadn \u0111\u01b0\u1ee3c ''{0}''
query.error.radius_negative         = b\u00e1n k\u00ednh ph\u1ea3i >= 0 (nh\u1eadn \u0111\u01b0\u1ee3c {0}) \u2014 d\u00f9ng r:#global \u0111\u1ec3 kh\u00f4ng gi\u1edbi h\u1ea1n
query.error.radius_no_position      = r:<n> c\u1ea7n v\u1ecb tr\u00ed ng\u01b0\u1eddi ch\u01a1i; console ph\u1ea3i d\u00f9ng r:#global ho\u1eb7c r:#world_<key>
query.error.action_required         = a: c\u1ea7n m\u1ed9t t\u00ean h\u00e0nh \u0111\u1ed9ng \u2014 {0}
query.error.action_unknown          = h\u00e0nh \u0111\u1ed9ng kh\u00f4ng x\u00e1c \u0111\u1ecbnh ''{0}'' \u2014 {1}
query.error.ident_empty             = {0} c\u1ea7n \u00edt nh\u1ea5t m\u1ed9t \u0111\u1ecbnh danh
query.error.ident_empty_entry       = {0} c\u00f3 m\u1ed9t m\u1ee5c r\u1ed7ng \u2014 h\u00e3y x\u00f3a d\u1ea5u ph\u1ea9y th\u1eeba
query.error.ident_bad_namespace     = kh\u00f4ng gian t\u00ean kh\u00f4ng h\u1ee3p l\u1ec7 ''{0}'' trong \u0111\u1ecbnh danh ''{1}''
query.error.ident_bad_path          = \u0111\u01b0\u1eddng d\u1eabn \u0111\u1ecbnh danh kh\u00f4ng h\u1ee3p l\u1ec7 ''{0}'' trong ''{1}''
query.error.flag_unknown            = c\u1edd kh\u00f4ng x\u00e1c \u0111\u1ecbnh ''{0}'' \u2014 c\u1edd h\u1ee3p l\u1ec7: #preview, #count, #verbose, #silent, #optimize
query.error.bad_token_wrap          = token kh\u00f4ng h\u1ee3p l\u1ec7 ''{0}'': {1}
# ---- /vg status section headers ---------------------------------------
status.section.guardian             = VonixGuardian
status.section.storage              = L\u01b0u tr\u1eef
status.section.queue                = H\u00e0ng \u0111\u1ee3i ghi
status.section.hooks                = Hook s\u1ef1 ki\u1ec7n
status.section.permissions          = Quy\u1ec1n
status.section.public_api           = API c\u00f4ng khai
# ---- WorldEdit-backed radius keywords -------------------------------------
query.error.worldedit_not_installed = WorldEdit ch\u01b0a \u0111\u01b0\u1ee3c c\u00e0i \u0111\u1eb7t \u2014 r:#we / r:#worldedit c\u1ea7n WorldEdit tr\u00ean m\u00e1y ch\u1ee7
query.error.worldedit_no_selection  = b\u1ea1n kh\u00f4ng c\u00f3 v\u00f9ng ch\u1ecdn WorldEdit n\u00e0o \u0111ang ho\u1ea1t \u0111\u1ed9ng \u2014 tr\u01b0\u1edbc ti\u00ean h\u00e3y t\u1ea1o v\u00f9ng ch\u1ecdn b\u1eb1ng //wand
