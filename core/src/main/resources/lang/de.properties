# VonixGuardian - German (de) message bundle
#
# Format: MessageFormat (java.text.MessageFormat).
#   Placeholders: {0}, {1} - a literal '{' must be escaped as ''{''
#   Single quotes must be doubled: '' - see MessageFormat javadoc.
#
# Key set is identical to en_us.properties (enforced by LangBundleParityTest).
# Values were re-translated from the en_us SEMANTICS, not from the CoreProtect
# seed file this bundle was originally generated from. Several seed lines carried
# a weaker or wrong meaning (e.g. "not approved" for "not supported"), so they
# were replaced rather than kept.
#
# Do not translate the literal syntax tokens in these strings: u: t: r: a: i: e:,
# #sentinel, #keyword, #global, #world_nether, #world_<key>, #we, #worldedit,
# //wand, the unit letters s m h d w, and the examples 1h / 2w5d / 1h-2h.
# They are parsed by QueryParser and must stay byte-identical to the input
# grammar.

# ---- QueryParser (/vg lookup <filter>) player errors ----------------------
query.error.expected_prefix         = erwartet wird ''<Pr\u00e4fix>:<Wert>'' (u:, t:, r:, a:, i:, e:) oder #flag
query.error.unknown_prefix          = unbekanntes Pr\u00e4fix ''{0}:'' \u2014 erwartet wird eines von u: t: r: a: i: e:
query.error.user_empty              = u: erfordert mindestens einen Spielernamen oder #sentinel
query.error.user_empty_entry        = u: enth\u00e4lt einen leeren Eintrag \u2014 entferne das \u00fcberz\u00e4hlige Komma
query.error.user_invalid_name       = ''{0}'' ist kein g\u00fcltiger Spielername (Buchstaben, Ziffern, Unterstrich; max. 16) \u2014 meinten Sie ein #sentinel?
query.error.time_required           = t: erfordert eine Dauer wie 1h, 2w5d oder 1h-2h
query.error.time_range_both_sides   = t: ein Bereich braucht auf beiden Seiten von ''-'' eine Dauer (z. B. 1h-2h)
query.error.duration_no_number      = ein Dauer-Bestandteil muss mit einer Zahl beginnen: ''{0}''
query.error.duration_missing_unit   = bei der Dauer ''{0}'' fehlt die Einheit (verwende s, m, h, d oder w)
query.error.duration_bad_number     = die Dauer ''{0}'' enth\u00e4lt die ung\u00fcltige Zahl ''{1}''
query.error.duration_unknown_unit   = unbekannte Dauereinheit ''{0}'' in ''{1}'' \u2014 verwende s, m, h, d oder w
query.error.duration_empty          = leere Dauer
query.error.radius_required         = r: erfordert einen Radius (z. B. r:10, r:#global, r:#world_nether)
query.error.radius_not_integer      = der Radius muss eine nicht negative ganze Zahl oder ein #keyword sein, erhalten: ''{0}''
query.error.radius_negative         = der Radius muss >= 0 sein (erhalten: {0}) \u2014 verwende r:#global f\u00fcr unbegrenzt
query.error.radius_no_position      = r:<n> erfordert eine Spielerposition; die Konsole muss r:#global oder r:#world_<key> verwenden
query.error.action_required         = a: erfordert einen Aktionsnamen \u2014 {0}
query.error.action_unknown          = unbekannte Aktion ''{0}'' \u2014 {1}
query.error.ident_empty             = {0} erfordert mindestens eine Kennung
query.error.ident_empty_entry       = {0} enth\u00e4lt einen leeren Eintrag \u2014 entferne das \u00fcberz\u00e4hlige Komma
query.error.ident_bad_namespace     = ung\u00fcltiger Namensraum ''{0}'' in der Kennung ''{1}''
query.error.ident_bad_path          = ung\u00fcltiger Kennungspfad ''{0}'' in ''{1}''
query.error.flag_unknown            = unbekanntes Flag ''{0}'' \u2014 g\u00fcltige Flags: #preview, #count, #verbose, #silent, #optimize
query.error.bad_token_wrap          = fehlerhaftes Token ''{0}'': {1}
# ---- /vg status section headers ---------------------------------------
status.section.guardian             = VonixGuardian
status.section.storage              = Speicher
status.section.queue                = Schreibwarteschlange
status.section.hooks                = Ereignis-Hooks
status.section.permissions          = Berechtigungen
status.section.public_api           = \u00d6ffentliche API
# ---- WorldEdit-backed radius keywords -------------------------------------
query.error.worldedit_not_installed = WorldEdit ist nicht installiert \u2014 r:#we / r:#worldedit erfordert WorldEdit auf dem Server
query.error.worldedit_no_selection  = Sie haben keine aktive WorldEdit-Auswahl - erstellen Sie zuerst mit //wand eine Auswahl
