# VonixGuardian - Tatar (tt) message bundle
#
# STATUS: TRANSLATED for 2.3.0, NOT YET NATIVE-REVIEWED.
#
# All 32 keys carry Tatar (Cyrillic) prose. Every placeholder token set matches
# en_us exactly, and LangBundleParityTest.every_bundle_value_renders_at_its_call_site_arity
# renders each value through MessageFormat at the arity the call site actually
# passes, so no key can throw at runtime.
#
# What that does and does not prove:
#   PROVEN  - source keys are complete and format-safe; config.language=tt is usable.
#   NOT     - that a native Tatar speaker would word these the way a Tatar server
#             operator expects. Treat the wording as a strong draft, not as
#             reviewed copy. Have a speaker read it before advertising Tatar
#             support publicly.
#
# Translation notes:
#   - Minecraft vocabulary (WorldEdit, #sentinel, #preview, u: t: r: a: i: e:,
#     and every id/flag) is left byte-identical: these are typed by players and
#     parsed by the server, so translating them would break the command.
#   - Where Tatar word order differs from English, {1} may precede {0}. That is
#     correct: MessageFormat substitutes by index, not by position.
#   - status.section.guardian is the product name and is deliberately untranslated.
#
# Encoding: \\uXXXX escapes, matching every other bundle in this directory.
#
# Format: MessageFormat (java.text.MessageFormat).
#   Placeholders: {0}, {1} - a literal '{' must be escaped as ''{''
#   Single quotes must be doubled: '' - see MessageFormat javadoc.

