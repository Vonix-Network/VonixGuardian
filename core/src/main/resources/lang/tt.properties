# VonixGuardian - Tatar (tt) message bundle
#
# STATUS: NOT TRANSLATED for 2.3.0. This bundle is INCOMPLETE as a localisation.
# Every key resolves (parity with en_us is enforced by LangBundleParityTest),
# but two groups of entries are not trustworthy Tatar:
#
#   #TODO-i18n needs-translation  - English placeholder text. No Tatar exists
#                                   yet; a native speaker must supply it.
#   #TODO-i18n verify-existing    - older CoreProtect-derived Tatar lines that
#                                   were never checked against the current
#                                   en_us meaning. Several use a weaker sense
#                                   (e.g. action_required says not-approved
#                                   where en_us says not-supported).
#
# No machine translation was used here on purpose: an invented wrong string is
# worse than an honest English one. Do not fill these values in from a
# translation service without a native speaker reviewing them.
#
# Format: MessageFormat (java.text.MessageFormat).
#   Placeholders: {0}, {1} - a literal '{' must be escaped as ''{''
#   Single quotes must be doubled: '' - see MessageFormat javadoc.

