# VonixGuardian - Tatar (tt) message bundle
#
# STATUS: NOT TRANSLATED for 2.3.0. This bundle is INCOMPLETE as a localisation.
# It is shipped so that config.language=tt is selectable and key parity holds
# (LangBundleParityTest enforces parity with en_us.properties). In practice 29
# of its 32 values are untranslated English copies, and the other 3 carry
# unreviewed Tatar - so no key here is a trustworthy Tatar string yet.
#
# No machine translation was used here on purpose: an invented wrong string in
# an operator's error message is worse than an honest English one. Do not fill
# these values in from a translation service without a native speaker reviewing
# them. The untranslated entries are marked in two groups:
#
#   #TODO-i18n needs-translation  (28 keys)
#       English placeholder text, copied from en_us. No Tatar exists yet; a
#       native speaker must supply it. Most of these are QueryParser errors
#       whose content is syntax (u: t: r: a: i: e:, #flag, {0}), so translate
#       only the surrounding prose and leave every token byte-identical.
#
#   #TODO-i18n verify-existing    (3 keys)
#       Older CoreProtect-derived Tatar lines, carried over by the 2.3.0 parity
#       fill and never checked against the current en_us meaning. They read as
#       plausible Tatar but are known to be lossy:
#         query.error.user_empty         says "specify the user"; en_us asks for
#                                        at least one player name or #sentinel.
#         query.error.user_invalid_name  omits the actionable part of en_us -
#                                        the allowed characters and the 16-char
#                                        limit - keeping only "invalid name".
#         query.error.radius_required    is close ("please enter a valid
#                                        radius") but not verified by a speaker.
#       A native speaker must confirm or replace these before they are trusted.
#
# The remaining key, status.section.guardian, is the product name and is
# deliberately untranslated, so it carries no marker.
#
# IMPORTANT - these 29 English values are COPIES, not fallbacks.
# They are byte-identical to en_us rather than absent, because parity is a hard
# test requirement and a missing key would be silent. The practical difference:
# an absent key would pick up future en_us wording automatically, whereas these
# pinned copies will NOT. If en_us is reworded, tt keeps the old English until
# someone edits this file. Treat every line below as needing review, not as
# already correct.
#
# Format: MessageFormat (java.text.MessageFormat).
#   Placeholders: {0}, {1} - a literal '{' must be escaped as ''{''
#   Single quotes must be doubled: '' - see MessageFormat javadoc.

