query.error.duration_unknown_unit   = ''{1}'' \u4e2d\u5b58\u5728\u672a\u77e5\u7684\u65f6\u957f\u5355\u4f4d ''{0}'' \u2014 \u8bf7\u4f7f\u7528 s\u3001m\u3001h\u3001d\u3001w
