# VonixGuardian - Turkish (tr) message bundle
#
# Format: MessageFormat (java.text.MessageFormat).
#   Placeholders: {0}, {1} - a literal '{' must be escaped as ''{''
#   Single quotes must be doubled: '' - see MessageFormat javadoc.
#
# Key set is identical to en_us.properties (enforced by LangBundleParityTest).
# Values were re-translated from the en_us SEMANTICS, not from the CoreProtect
# seed file this bundle was originally generated from. Several seed lines carried
# a weaker or wrong meaning (e.g. "not approved" for "not supported"), so they
# were replaced rather than kept.
#
# Do not translate the literal syntax tokens in these strings: u: t: r: a: i: e:,
# #sentinel, #keyword, #global, #world_nether, #world_<key>, #we, #worldedit,
# //wand, the unit letters s m h d w, and the examples 1h / 2w5d / 1h-2h.
# They are parsed by QueryParser and must stay byte-identical to the input
# grammar.

# ---- QueryParser (/vg lookup <filter>) player errors ----------------------
query.error.expected_prefix         = ''<\u00f6nek>:<de\u011fer>'' bekleniyordu (u:, t:, r:, a:, i:, e:) veya #flag
query.error.unknown_prefix          = bilinmeyen \u00f6nek ''{0}:'' \u2014 \u015funlardan biri olmal\u0131: u: t: r: a: i: e:
query.error.user_empty              = u: en az bir oyuncu ad\u0131 veya #sentinel gerektirir
query.error.user_empty_entry        = u: bo\u015f bir giri\u015f i\u00e7eriyor \u2014 fazladan virg\u00fcl\u00fc kald\u0131r\u0131n
query.error.user_invalid_name       = ''{0}'' ge\u00e7erli bir oyuncu ad\u0131 de\u011fil (harf, rakam, alt \u00e7izgi; en fazla 16) \u2014 #sentinel mi demek istediniz?
query.error.time_required           = t: 1h, 2w5d veya 1h-2h gibi bir s\u00fcre gerektirir
query.error.time_range_both_sides   = t: aral\u0131k, ''-'' i\u015faretinin iki yan\u0131nda s\u00fcre gerektirir (\u00f6r. 1h-2h)
query.error.duration_no_number      = s\u00fcre bile\u015feni bir say\u0131yla ba\u015flamal\u0131d\u0131r: ''{0}''
query.error.duration_missing_unit   = ''{0}'' s\u00fcresinde birim eksik (s, m, h, d veya w kullan\u0131n)
query.error.duration_bad_number     = ''{0}'' s\u00fcresinde ge\u00e7ersiz say\u0131 ''{1}''
query.error.duration_unknown_unit   = ''{1}'' i\u00e7inde bilinmeyen s\u00fcre birimi ''{0}'' \u2014 s, m, h, d veya w kullan\u0131n
query.error.duration_empty          = bo\u015f s\u00fcre
query.error.radius_required         = r: bir yar\u0131\u00e7ap gerektirir (\u00f6r. r:10, r:#global, r:#world_nether)
query.error.radius_not_integer      = yar\u0131\u00e7ap negatif olmayan bir tam say\u0131 veya #keyword olmal\u0131; al\u0131nan: ''{0}''
query.error.radius_negative         = yar\u0131\u00e7ap >= 0 olmal\u0131 (al\u0131nan: {0}) \u2014 s\u0131n\u0131rs\u0131z i\u00e7in r:#global kullan\u0131n
query.error.radius_no_position      = r:<n> bir oyuncu konumu gerektirir; konsol r:#global veya r:#world_<key> kullanmal\u0131d\u0131r
query.error.action_required         = a: bir eylem ad\u0131 gerektirir \u2014 {0}
query.error.action_unknown          = bilinmeyen eylem ''{0}'' \u2014 {1}
query.error.ident_empty             = {0} en az bir tan\u0131mlay\u0131c\u0131 gerektirir
query.error.ident_empty_entry       = {0} bo\u015f bir giri\u015f i\u00e7eriyor \u2014 fazladan virg\u00fcl\u00fc kald\u0131r\u0131n
query.error.ident_bad_namespace     = ''{1}'' tan\u0131mlay\u0131c\u0131s\u0131nda ge\u00e7ersiz ad alan\u0131 ''{0}''
query.error.ident_bad_path          = ''{1}'' i\u00e7inde ge\u00e7ersiz tan\u0131mlay\u0131c\u0131 yolu ''{0}''
query.error.flag_unknown            = bilinmeyen bayrak ''{0}'' \u2014 ge\u00e7erli bayraklar: #preview, #count, #verbose, #silent, #optimize
query.error.bad_token_wrap          = hatal\u0131 belirte\u00e7 ''{0}'': {1}
