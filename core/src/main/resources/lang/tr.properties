query.error.worldedit_not_installed = WorldEdit kurulu de\u011fil \u2014 r:#we / r:#worldedit sunucuda WorldEdit gerektirir
query.error.worldedit_no_selection  = etkin bir WorldEdit se\u00e7iminiz yok \u2014 \u00f6nce //wand ile bir se\u00e7im yap\u0131n
